name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Matches local development: the macOS 26 image's Xcode 26.6 crashes in IRGen on
    # SettingsView.swift; Xcode 27 compiles it fine.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
